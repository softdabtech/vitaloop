# Include this file INSIDE the vitaloop.today TLS server block only after the
# app.vitaloop.today vhost has passed authenticated smoke tests.
#
# It intentionally redirects only English end-user and auth routes. Public
# marketing, Health Hub, UA, API, CRM and Stripe webhook routes stay on their
# existing hosts. `$request_uri` preserves both the route and query string.

location ~ ^/(login|register|auth/confirmation|dashboard|today|symptom-check|results-trends|upload|lab-plan|lab-results|health-profile|subscription|account|settings|billing-history|help-center|onboarding|questionnaire|check-ins|checkin|insights|timeline|dashboard-legacy)(/|$) {
    return 301 https://app.vitaloop.today$request_uri;
}

location ~ ^/(results|protocol)(/[^/]+)?/?$ {
    return 301 https://app.vitaloop.today$request_uri;
}
