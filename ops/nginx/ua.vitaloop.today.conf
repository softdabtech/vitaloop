# nginx config for ua.vitaloop.today (Vitaloop Ukraine SPA)
# Uses an isolated UA frontend dist under /var/www/UAVITALOOP.

server {
    server_name ua.vitaloop.today;

    # Security headers — defined once at server level.
    # IMPORTANT: any location block with its own add_header must also
    # include this snippet, because nginx add_header does NOT inherit
    # from the parent block when the child has any add_header of its own.
    include /etc/nginx/snippets/security-headers.conf;

    root /var/www/UAVITALOOP/frontend/dist;
    index index.html;

    location = /ua-index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /manifest.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /registerSW.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /build-info.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Authenticated/app routes must always hydrate the Ukrainian SPA shell.
    # The shared build also contains EN noindex snapshots for these paths;
    # serving those on ua.vitaloop.today causes mixed-language direct loads.
    location ~ ^/(login|register|auth/confirmation|dashboard|upload|lab-plan|avatar|assignments|lab-results|results|protocol|progress|settings|health-profile|subscription|billing-history|help-center|onboarding|questionnaire|check-ins|insights|ops|admin/dashboard|crm/(programs|clients|practitioners|activity))(/.*)?$ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/vitaloop.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitaloop.today/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name ua.vitaloop.today;
    listen 80;
    return 301 https://ua.vitaloop.today$request_uri;
}
