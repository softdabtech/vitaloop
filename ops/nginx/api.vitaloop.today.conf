server {
    server_name api.vitaloop.today;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    set $cors_origin "";
    if ($http_origin ~* "^(https://(vitaloop\.today|www\.vitaloop\.today|crm\.vitaloop\.today|ua\.vitaloop\.today|www\.ua\.vitaloop\.today)|http://(localhost|127\.0\.0\.1):(5173|4173|4174))$") {
        set $cors_origin $http_origin;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials true         always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Accept, Accept-Language, Authorization, Content-Language, Content-Type, apikey, x-client-info, X-Idempotency-Key, X-Request-ID, X-CSRF-Token, X-Partner-Api-Key, X-Embedded-Token, X-Partner-Context, x-supabase-api-version, stripe-signature, X-Vitaloop-Locale" always;
            add_header Access-Control-Max-Age           600 always;
            add_header Content-Length                   0;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true         always;
        add_header Access-Control-Expose-Headers    X-Request-ID always;
        add_header Vary                             Origin       always;

        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    location @backend_unavailable {
        default_type application/json;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true         always;
        add_header Cache-Control                    no-store     always;
        return 503 '{"detail":"Service temporarily unavailable","code":"SERVICE_UNAVAILABLE"}';
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/vitaloop.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitaloop.today/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = api.vitaloop.today) {
        return 301 https://$host$request_uri;
    }
    server_name api.vitaloop.today;
    listen 80;
    return 404;
}
