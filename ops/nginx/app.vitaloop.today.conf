# VITALOOP English end-user cabinet — staged vhost.
#
# Install to /etc/nginx/sites-available/app.vitaloop.today. Do NOT enable this
# file until app.vitaloop.today DNS resolves to this origin and a valid origin
# certificate has been provisioned at the paths below. Cloudflare must use
# Full (strict), never Flexible SSL.
#
# The vhost proxies the same immutable frontend image as vitaloop.today. The
# application distinguishes the host and sends / to /dashboard; all cabinet
# routes retain SPA fallback through the frontend container.

server {
    listen 443 ssl;
    server_name app.vitaloop.today;

    # Certificate must contain app.vitaloop.today (Certbot or a Cloudflare
    # Origin Certificate). These paths are intentionally separate from the
    # apex certificate so nginx cannot be enabled before TLS is ready.
    ssl_certificate /etc/letsencrypt/live/app.vitaloop.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vitaloop.today/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/security-headers.conf;

    # A cabinet root should never render the public landing page.
    location = / {
        return 302 /dashboard/;
    }

    # HTML and mutable application metadata must be revalidated after each
    # release. Repeat headers because nginx does not inherit add_header from
    # the server block once a nested location sets one.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(manifest\.json|sw\.js|registerSW\.js|build-info\.json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite content-hashed assets are safe to cache immutably.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The frontend container owns SPA fallback (`try_files ... /index.html`).
    location / {
        proxy_pass http://127.0.0.1:8080;
        # The upstream frontend receives HTTP from this local proxy. Preserve
        # the public HTTPS scheme when it normalizes a trailing slash.
        proxy_redirect ~^http://[^/]+(/.*)$ https://$host$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name app.vitaloop.today;
    return 301 https://app.vitaloop.today$request_uri;
}
