server {
    server_name crm.vitaloop.today;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Stability Monitor — /ops/monitor/* proxied to internal port 9099
    location /ops/monitor/dashboard {
        proxy_pass http://127.0.0.1:9099/dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ops/monitor/status {
        proxy_pass http://127.0.0.1:9099/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ops/monitor/history {
        proxy_pass http://127.0.0.1:9099/history;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ops/monitor/logs {
        proxy_pass http://127.0.0.1:9099/logs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        # Remove ASP.NET's own HSTS header (max-age=2592000) to avoid duplicates;
        # nginx sets the canonical max-age=31536000 via add_header above.
        proxy_hide_header Strict-Transport-Security;

        proxy_pass http://127.0.0.1:5090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vitaloop.today/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vitaloop.today/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = crm.vitaloop.today) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name crm.vitaloop.today;
    listen 80;
    return 404; # managed by Certbot


}