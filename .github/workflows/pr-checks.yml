name: PR Checks

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend — lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          python - <<'EOF'
          import ast, os, sys
          errors = []
          for root, dirs, files in os.walk("app"):
              dirs[:] = [d for d in dirs if d != "__pycache__"]
              for f in files:
                  if not f.endswith(".py"):
                      continue
                  path = os.path.join(root, f)
                  with open(path) as fh:
                      src = fh.read()
                  try:
                      ast.parse(src)
                  except SyntaxError as e:
                      errors.append(f"{path}: {e}")
          if errors:
              for e in errors:
                  print("SYNTAX ERROR:", e)
              sys.exit(1)
          EOF

      - name: Unit tests
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
        run: pytest tests -q --tb=short

  crm-test:
    name: CRM — .NET unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./crm-mvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore tests/Vitaloop.Crm.Web.Tests/

      - name: Run xUnit tests
        run: dotnet test tests/Vitaloop.Crm.Web.Tests/ --no-restore -m:1

  frontend-build:
    name: Frontend — build check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Static routes, links, and claims
        run: npm run qa:routes && npm run qa:links:strict && npm run qa:claims

      - name: Build
        run: NODE_OPTIONS=--max-old-space-size=1536 vite build --mode production

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run canonical user-flow E2E
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: |
          npm run dev -- --mode production --host localhost > /tmp/vitaloop-vite.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://localhost:5173 >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:5173 >/dev/null
          npx playwright test tests/symptom-check-en.spec.ts tests/today-dashboard.spec.ts --project=chromium --reporter=list
