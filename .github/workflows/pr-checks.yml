name: PR Checks

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend — lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          python - <<'EOF'
          import ast, os, sys
          errors = []
          for root, dirs, files in os.walk("app"):
              dirs[:] = [d for d in dirs if d != "__pycache__"]
              for f in files:
                  if not f.endswith(".py"):
                      continue
                  path = os.path.join(root, f)
                  with open(path) as fh:
                      src = fh.read()
                  try:
                      ast.parse(src)
                  except SyntaxError as e:
                      errors.append(f"{path}: {e}")
          if errors:
              for e in errors:
                  print("SYNTAX ERROR:", e)
              sys.exit(1)
          EOF

      - name: Unit tests
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
        run: pytest tests -q --tb=short

  crm-test:
    name: CRM — .NET unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./crm-mvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore tests/Vitaloop.Crm.Web.Tests/

      - name: Run xUnit tests
        run: dotnet test tests/Vitaloop.Crm.Web.Tests/ --no-restore -m:1

  frontend-build:
    name: Frontend — build check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      VITE_SUPABASE_URL: ${{ secrets.PROD_VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_VITE_SUPABASE_ANON_KEY }}
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Static routes, links, and claims
        run: npm run qa:routes && npm run qa:links:strict && npm run qa:claims

      - name: Build
        run: NODE_OPTIONS=--max-old-space-size=1536 vite build --mode production

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Preflight Playwright Chromium
        run: |
          set -euo pipefail
          executable_path=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')
          echo "Resolved Chromium executable: $executable_path"
          echo "PLAYWRIGHT_BROWSERS_PATH: $PLAYWRIGHT_BROWSERS_PATH"
          if [[ ! -x "$executable_path" ]]; then
            echo "Chromium executable does not exist or is not executable"
            find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 6 -print 2>/dev/null || true
            exit 1
          fi
          if ! node - <<'EOF'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF
          then
            echo "Chromium launch failed"
            echo "Resolved Chromium executable: $executable_path"
            echo "PLAYWRIGHT_BROWSERS_PATH: $PLAYWRIGHT_BROWSERS_PATH"
            find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 6 -print 2>/dev/null || true
            exit 1
          fi

      - name: Run canonical user-flow E2E
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: |
          npm run dev -- --mode production --host 127.0.0.1 > /tmp/vitaloop-vite.log 2>&1 &
          vite_pid=$!
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              cat /tmp/vitaloop-vite.log
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            cat /tmp/vitaloop-vite.log
            exit 1
          fi
          npx playwright test tests/symptom-check-en.spec.ts tests/today-dashboard.spec.ts --project=chromium --reporter=list
