name: Staging Live Supabase Smoke

permissions:
  contents: read

concurrency:
  group: staging-live-smoke
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  smoke-tests:
    name: Run live smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live staging smoke tests
        id: run_smoke
        working-directory: ./backend
        env:
          E2E_RUN_LIVE: "1"
          E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
          E2E_BEARER_TOKEN: ${{ secrets.E2E_BEARER_TOKEN }}
          E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}
          E2E_INVITE_EMAIL: ${{ secrets.E2E_INVITE_EMAIL }}
          E2E_SUPABASE_URL: ${{ secrets['E2E_SUPABASE_URL'] }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets['E2E_SUPABASE_SERVICE_ROLE_KEY'] }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets['E2E_SUPABASE_ANON_KEY'] }}
        run: |
          if [ -z "${E2E_API_BASE_URL}" ]; then
            echo "Missing required secret: E2E_API_BASE_URL"
            exit 1
          fi
          if [ -z "${E2E_BEARER_TOKEN}" ]; then
            echo "Missing required secret: E2E_BEARER_TOKEN"
            exit 1
          fi
          if [ -z "${E2E_SUPABASE_URL}" ]; then
            echo "Missing required secret: E2E_SUPABASE_URL"
            exit 1
          fi
          if [ -z "${E2E_SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Missing required secret: E2E_SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi
          if [ -z "${E2E_SUPABASE_ANON_KEY}" ]; then
            echo "Missing required secret: E2E_SUPABASE_ANON_KEY"
            exit 1
          fi
          set +e
          pytest -q tests/test_staging_live_supabase_smoke.py tests/test_health_profile_live_smoke.py 2>&1 | tee smoke-output.txt
          test_exit_code=${PIPESTATUS[0]}
          echo "exit_code=${test_exit_code}" >> "$GITHUB_OUTPUT"
          exit ${test_exit_code}

      - name: Publish smoke summary
        if: always()
        working-directory: ./backend
        env:
          E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
        run: |
          exit_code="${{ steps.run_smoke.outputs.exit_code }}"
          if [ -z "${exit_code}" ]; then
            exit_code="unknown"
          fi

          {
            echo "## Staging Live Supabase Smoke"
            echo ""
            echo "- Exit code: ${exit_code}"
            echo "- API base: ${E2E_API_BASE_URL:-unset}"
            echo ""
            echo "### Tail of pytest output"
            echo '```text'
            if [ -f smoke-output.txt ]; then
              tail -n 40 smoke-output.txt
            else
              echo "No smoke-output.txt produced"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
