name: Staging Live Supabase Smoke

permissions:
  contents: read

concurrency:
  group: staging-live-smoke
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  smoke-tests:
    name: Run live smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets are configured
        id: check_secrets
        env:
          E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
          E2E_BEARER_TOKEN: ${{ secrets.E2E_BEARER_TOKEN }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        run: |
          # This workflow runs on a daily schedule against a staging
          # environment that may not have its E2E_* secrets configured yet
          # (e.g. a fresh fork, or staging credentials not yet provisioned).
          # That is a configuration gap, not an application bug — so this
          # step turns it into a neutral skip of the actual smoke run
          # instead of a hard, red schedule failure every night.
          missing=""
          for name in E2E_API_BASE_URL E2E_BEARER_TOKEN E2E_SUPABASE_URL E2E_SUPABASE_SERVICE_ROLE_KEY E2E_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "Skipping live smoke run — required secrets not configured:${missing}"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        if: steps.check_secrets.outputs.configured == 'true'
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live staging smoke tests
        id: run_smoke
        if: steps.check_secrets.outputs.configured == 'true'
        working-directory: ./backend
        env:
          E2E_RUN_LIVE: "1"
          E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
          E2E_BEARER_TOKEN: ${{ secrets.E2E_BEARER_TOKEN }}
          E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}
          E2E_INVITE_EMAIL: ${{ secrets.E2E_INVITE_EMAIL }}
          E2E_SUPABASE_URL: ${{ secrets['E2E_SUPABASE_URL'] }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets['E2E_SUPABASE_SERVICE_ROLE_KEY'] }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets['E2E_SUPABASE_ANON_KEY'] }}
        run: |
          set +e
          pytest -q tests/test_staging_live_supabase_smoke.py tests/test_health_profile_live_smoke.py 2>&1 | tee smoke-output.txt
          test_exit_code=${PIPESTATUS[0]}
          echo "exit_code=${test_exit_code}" >> "$GITHUB_OUTPUT"
          exit ${test_exit_code}

      - name: Publish smoke summary
        if: always()
        working-directory: ./backend
        env:
          E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
        run: |
          if [ "${{ steps.check_secrets.outputs.configured }}" != "true" ]; then
            {
              echo "## Staging Live Supabase Smoke"
              echo ""
              echo "Skipped: required E2E_* secrets are not configured for this repo/environment."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit_code="${{ steps.run_smoke.outputs.exit_code }}"
          if [ -z "${exit_code}" ]; then
            exit_code="unknown"
          fi

          {
            echo "## Staging Live Supabase Smoke"
            echo ""
            echo "- Exit code: ${exit_code}"
            echo "- API base: ${E2E_API_BASE_URL:-unset}"
            echo ""
            echo "### Tail of pytest output"
            echo '```text'
            if [ -f smoke-output.txt ]; then
              tail -n 40 smoke-output.txt
            else
              echo "No smoke-output.txt produced"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
