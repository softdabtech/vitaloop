name: Post Deploy Live Smoke

permissions:
  contents: read

concurrency:
  group: post-deploy-live-smoke
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  smoke-tests:
    name: Run post-deploy smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run post-deploy live smoke tests
        id: run_smoke
        working-directory: ./backend
        env:
          E2E_RUN_LIVE: "1"
          E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
          E2E_BEARER_TOKEN: ${{ secrets.E2E_BEARER_TOKEN }}
          E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}
          E2E_INVITE_EMAIL: ${{ secrets.E2E_INVITE_EMAIL }}
        run: |
          if [ -z "${E2E_API_BASE_URL}" ]; then
            echo "Missing required secret: E2E_API_BASE_URL"
            exit 1
          fi
          if [ -z "${E2E_BEARER_TOKEN}" ]; then
            echo "Missing required secret: E2E_BEARER_TOKEN"
            exit 1
          fi
          set +e
          pytest -q tests/test_staging_live_supabase_smoke.py 2>&1 | tee smoke-output.txt
          test_exit_code=${PIPESTATUS[0]}
          echo "exit_code=${test_exit_code}" >> "$GITHUB_OUTPUT"
          exit ${test_exit_code}

      - name: Publish smoke summary
        if: always()
        working-directory: ./backend
        env:
          E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
        run: |
          exit_code="${{ steps.run_smoke.outputs.exit_code }}"
          if [ -z "${exit_code}" ]; then
            exit_code="unknown"
          fi

          {
            echo "## Post Deploy Live Smoke"
            echo ""
            echo "- Trigger: workflow_dispatch"
            echo "- Checked commit: ${{ github.sha }}"
            echo "- Exit code: ${exit_code}"
            echo "- API base: ${E2E_API_BASE_URL:-unset}"
            echo ""
            echo "### Tail of pytest output"
            echo '```text'
            if [ -f smoke-output.txt ]; then
              tail -n 40 smoke-output.txt
            else
              echo "No smoke-output.txt produced"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
