name: CI / CD

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Backend lint + unit tests (no Supabase needed)
  # ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend — lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax-check all .py files
        run: |
          python - <<'EOF'
          import ast, os, sys
          errors = []
          for root, dirs, files in os.walk("app"):
              dirs[:] = [d for d in dirs if d != "__pycache__"]
              for f in files:
                  if not f.endswith(".py"):
                      continue
                  path = os.path.join(root, f)
                  with open(path) as fh:
                      src = fh.read()
                  try:
                      ast.parse(src)
                  except SyntaxError as e:
                      errors.append(f"{path}: {e}")
          if errors:
              for e in errors:
                  print("SYNTAX ERROR:", e)
              sys.exit(1)
          print(f"Syntax OK — {sum(1 for r,d,fs in os.walk('app') for f in fs if f.endswith('.py'))} files checked")
          EOF

      - name: Run unit tests
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
        run: |
          pytest tests/test_analyze.py \
                 tests/test_router_input_guards.py \
                 tests/test_rate_limit_middleware.py \
                 tests/test_billing_stripe.py \
                 tests/test_knowledge_rule_evaluator.py \
                 tests/test_knowledge_governance_api.py \
                 tests/test_cors_origins.py \
                 tests/test_uuid_validation.py \
                 tests/test_ua_wellbeing_assessment.py \
                 -q --tb=short

  # ─────────────────────────────────────────────────────────
  # JOB 2: CRM .NET tests
  # ─────────────────────────────────────────────────────────
  crm-test:
    name: CRM — .NET unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./crm-mvc

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run xUnit tests
        run: dotnet test tests/Vitaloop.Crm.Web.Tests/ -q

  # ─────────────────────────────────────────────────────────
  # JOB 3: Frontend build + Playwright smoke
  # ─────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — build & E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: NODE_OPTIONS=--max-old-space-size=1536 vite build --mode production

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright smoke tests (EN site)
        env:
          PLAYWRIGHT_BASE_URL: "https://vitaloop.today"
        run: npx playwright test tests/sidebar-links.spec.ts tests/subscription-status.spec.ts --project=chromium --reporter=list
        continue-on-error: true  # E2E smoke is advisory; doesn't block deploy

  # ─────────────────────────────────────────────────────────
  # JOB 3: Deploy to production (only on push to main)
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend-test, crm-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest code on server
        run: |
          ssh root@${{ secrets.PROD_HOST }} "
            cd /var/www/VITALOOP &&
            git pull origin main
          "

      - name: Restart backend service
        run: |
          ssh root@${{ secrets.PROD_HOST }} "
            systemctl restart vitaloop-backend &&
            sleep 4 &&
            systemctl is-active vitaloop-backend
          "

      - name: Build and deploy frontend
        run: |
          ssh root@${{ secrets.PROD_HOST }} "
            cd /var/www/VITALOOP/frontend &&
            NODE_OPTIONS=--max-old-space-size=1536 npm run build:prod &&
            cp -r dist/* /var/www/html/ &&
            nginx -s reload
          "

      - name: Health check
        run: |
          sleep 5
          status=$(curl -sf -o /dev/null -w "%{http_code}" https://${{ secrets.PROD_HOST }}/health || echo "000")
          echo "Health endpoint returned: $status"
          if [[ "$status" != "200" ]]; then
            echo "Health check FAILED (status=$status)"
            exit 1
          fi
          echo "Health check PASSED"
