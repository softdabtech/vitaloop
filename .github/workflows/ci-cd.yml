name: CI / CD

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Backend lint + unit tests (no Supabase needed)
  # ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend — lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax-check all .py files
        run: |
          python - <<'EOF'
          import ast, os, sys
          errors = []
          for root, dirs, files in os.walk("app"):
              dirs[:] = [d for d in dirs if d != "__pycache__"]
              for f in files:
                  if not f.endswith(".py"):
                      continue
                  path = os.path.join(root, f)
                  with open(path) as fh:
                      src = fh.read()
                  try:
                      ast.parse(src)
                  except SyntaxError as e:
                      errors.append(f"{path}: {e}")
          if errors:
              for e in errors:
                  print("SYNTAX ERROR:", e)
              sys.exit(1)
          print(f"Syntax OK — {sum(1 for r,d,fs in os.walk('app') for f in fs if f.endswith('.py'))} files checked")
          EOF

      - name: Run unit tests
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
        run: |
          pytest tests/test_analyze.py \
                 tests/test_router_input_guards.py \
                 tests/test_rate_limit_middleware.py \
                 tests/test_knowledge_rule_evaluator.py \
                 tests/test_knowledge_governance_api.py \
                 tests/test_cors_origins.py \
                 tests/test_uuid_validation.py \
                 tests/test_ua_wellbeing_assessment.py \
                 -q --tb=short

  # ─────────────────────────────────────────────────────────
  # JOB 2: CRM .NET tests
  # ─────────────────────────────────────────────────────────
  crm-test:
    name: CRM — .NET unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./crm-mvc

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore tests/Vitaloop.Crm.Web.Tests/

      # `dotnet test ... -q` on this SDK misclassifies benign diagnostic
      # messages (e.g. "Creating directory obj/Debug/net8.0/staticwebassets/",
      # "Building target X completely" — normal detailed-verbosity build
      # chatter, not errors) as "error :" and fails the whole run with exit
      # code 1, even though nothing actually went wrong. Reproduced locally
      # with the exact pinned SDK (8.0.425): identical command WITH -q
      # failed on a rotating cast of unrelated "error :"-prefixed messages
      # (first StaticWebAssets' MakeDir step, then — after trying to route
      # around that with -p:StaticWebAssetsEnabled=false —
      # "Building target GenerateTargetFrameworkMonikerAttribute completely"
      # instead); the identical command WITHOUT -q passed clean both times,
      # 39/39 tests green. Dropping -q is the actual, minimal fix — no
      # property overrides needed. (This also means CI logs are more
      # verbose now, which is a feature, not a cost: -q was hiding useful
      # build output the whole time.)
      - name: Run xUnit tests
        run: dotnet test tests/Vitaloop.Crm.Web.Tests/ --no-restore -m:1

  # ─────────────────────────────────────────────────────────
  # JOB 3: Frontend build + Playwright smoke
  # ─────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — build & E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: NODE_OPTIONS=--max-old-space-size=1536 npx vite build --mode production

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright smoke tests (EN site)
        env:
          PLAYWRIGHT_BASE_URL: "https://vitaloop.today"
        run: npx playwright test tests/sidebar-links.spec.ts tests/subscription-status.spec.ts --project=chromium --reporter=list
        continue-on-error: true  # E2E smoke is advisory; doesn't block deploy

  # ─────────────────────────────────────────────────────────
  # JOB 3: Deploy to production (only on push to main)
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend-test, crm-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      # See RUNBOOK.md sections 2-3 for why this is the real deploy shape:
      # the backend runs in the Docker container (docker-compose.prod.yml),
      # but the live vitaloop.today frontend is static files served by host
      # nginx straight from frontend/dist/ — there is no vitaloop-backend
      # systemd unit and no /var/www/html/ in the real serving path. This
      # job used to assume both and would have failed outright, or worse,
      # silently deployed nothing, the moment it actually ran (it never had,
      # blocked by unrelated test failures, until 2026-09-11).
      - name: Pull latest code on server
        run: |
          ssh root@${{ secrets.PROD_HOST }} "
            cd /var/www/VITALOOP &&
            git fetch origin main &&
            git reset --hard origin/main
          "

      - name: Rebuild and restart backend (Docker)
        run: |
          ssh root@${{ secrets.PROD_HOST }} "
            cd /var/www/VITALOOP &&
            docker compose -f docker-compose.prod.yml build --no-cache backend &&
            docker compose -f docker-compose.prod.yml up -d --force-recreate backend
          "

      - name: Rebuild frontend (host static files nginx serves directly)
        run: |
          ssh root@${{ secrets.PROD_HOST }} "
            cd /var/www/VITALOOP/frontend &&
            npm ci --prefer-offline --no-audit --legacy-peer-deps &&
            NODE_OPTIONS=--max-old-space-size=2048 npm run build
          "

      - name: Health check
        run: |
          sleep 8
          backend_status=$(curl -sf -o /dev/null -w "%{http_code}" https://api.vitaloop.today/health || echo "000")
          echo "Backend health endpoint returned: $backend_status"
          if [[ "$backend_status" != "200" ]]; then
            echo "Backend health check FAILED (status=$backend_status)"
            exit 1
          fi

          frontend_status=$(curl -sf -o /dev/null -w "%{http_code}" https://vitaloop.today || echo "000")
          echo "Frontend returned: $frontend_status"
          if [[ "$frontend_status" != "200" ]]; then
            echo "Frontend check FAILED (status=$frontend_status)"
            exit 1
          fi
          echo "Health check PASSED"
