networks:
  vitaloop-network:
    driver: bridge
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    container_name: vitaloop-backend
    env_file:
    - ./backend/.env
    environment:
    - LOG_LEVEL=info
    - ENVIRONMENT=production
    expose:
    - '8000'
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
      - CMD-SHELL
      - python -c "import socket; socket.create_connection((\"127.0.0.1\", 8000),
        timeout=2)"
      timeout: 10s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
    - vitaloop-network
    ports:
    - 8004:8000
    restart: unless-stopped
    volumes:
    - backend-data:/app/data
    - ./backend/logs:/app/logs
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: vitaloop-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
    - REACT_APP_API_URL=https://api.vitaloop.today
    - NODE_ENV=production
    expose:
    - '80'
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
    - vitaloop-network
    ports:
    - 8080:80
    restart: unless-stopped
    volumes:
    - ./frontend/dist:/usr/share/nginx/html:ro
version: '3.9'
volumes:
  backend-data:
    driver: local
