server {
    server_name vitaloop.softdab.tech;

    # Allow large Authorization headers (some Supabase JWTs include heavy metadata).
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;
    
    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8004/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 20M;
    }
    
    # Serve frontend SPA
    root /var/www/VITALOOP/frontend/dist;
    
    # Use error_page 404 to serve index.html for SPA routing
    error_page 404 /index.html;
    
    # Cache: Assets with hash in filename (immutable, long expiration)
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mjs|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    
    # Cache: PDF worker (long cache)
    location ~* \.worker\.min\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }
    
    # No-cache: HTML files and resources served from root (including index.html via error_page)
    location ~ \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate, no-cache, no-store, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    
    # No cache: Manifest
    location = /manifest.webmanifest {
        types { application/manifest+json mjs webmanifest; }
        add_header Cache-Control "public, max-age=0, must-revalidate, no-cache, no-store" always;
    }
    
    # No cache: Service Worker
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate, no-cache, no-store" always;
    }
    
    # No cache: Service Worker registration
    location = /registerSW.js {
        add_header Cache-Control "public, max-age=0, must-revalidate, no-cache, no-store" always;
    }

    # No cache: Build metadata used for deploy verification and diagnostics
    location = /build-info.json {
        add_header Cache-Control "public, max-age=0, must-revalidate, no-cache, no-store" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Access and error logs
    access_log /var/log/nginx/vitaloop-access.log;
    error_log /var/log/nginx/vitaloop-error.log;
    
    # SSL configuration (managed by Certbot)
    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/vitaloop.softdab.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitaloop.softdab.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = vitaloop.softdab.tech) {
        return 301 https://$host$request_uri;
    }
    
    listen 80;
    listen [::]:80;
    server_name vitaloop.softdab.tech;
    return 404;
}
