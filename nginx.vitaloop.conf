# nginx config for vitaloop.today (frontend SPA)
# Production paths:
#   /etc/nginx/sites-available/vitaloop.today
#   /etc/nginx/sites-enabled/vitaloop.today  (standalone file — NOT a symlink)
# Deployed by: scripts/deploy-prod.sh when this file appears in git diff
# NOTE: SSL directives are managed by Certbot — do not remove.

# Redirect www → non-www (301 permanent)
server {
    server_name www.vitaloop.today;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/vitaloop.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitaloop.today/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://vitaloop.today$request_uri;
}

server {
    server_name vitaloop.today;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /var/www/VITALOOP/frontend/dist;
    index index.html;

    # Redirect legacy CRM entry paths to CRM app
    location = /dashboard {
        return 302 https://crm.vitaloop.today/auth/post-login;
    }

    location = /admin {
        return 302 https://crm.vitaloop.today/admin;
    }

    location = /ops {
        return 302 https://crm.vitaloop.today/ops;
    }

    # Canonical public route redirects.
    location = /product { return 301 /how-it-works/; }
    location = /pricing { return 301 /#pricing; }
    location = /stories { return 301 /#stories; }
    location = /investors { return 301 /for-investors/; }
    location = /privacy { return 301 /privacy-policy/; }
    location = /today { return 301 /dashboard; }
    location = /symptom-check { return 301 /questionnaire/; }
    location = /results-trends { return 301 /lab-results/; }
    location = /checkin { return 301 /check-ins/; }
    location = /timeline { return 301 /insights/; }
    location = /dashboard-legacy { return 301 /dashboard; }
    location = /ops/legacy { return 301 /ops; }

    location ~ ^/(how-it-works|features|symptom-intake|example-report|for-nutritionists|faq|for-investors|help|terms|privacy-policy|about)$ {
        return 301 $scheme://$host$uri/;
    }

    # No-cache: HTML shell (must revalidate so service worker updates propagate)
    location = /index.html {
        # add_header directives do not inherit when a location defines its own
        # headers, so repeat the security set for the SPA entry document.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # No-cache: Web App Manifest
    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # No-cache: Service Worker (browser must always re-fetch to detect updates)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # No-cache: Service Worker registration shim
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # No-cache: Build metadata — used by deploy validation and diagnostics
    location = /build-info.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Search-engine discovery files must update immediately after deploys.
    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Proxy API requests to analysis service
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Static route snapshots generated during the frontend build.
    location / {
        try_files $uri $uri/ =404;
    }

    # Dynamic application routes still need the SPA shell.
    location ~ ^/(results/[^/]+|protocol/[^/]+|assignments/[^/]+|crm/(programs|clients|practitioners|activity)(/[^/]+)?)/?$ {
        try_files /index.html =404;
    }

    error_page 404 /404.html;

    # Long cache: hashed assets (immutable filenames from Vite build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SSL — managed by Certbot, do not edit manually
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/vitaloop.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vitaloop.today/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.vitaloop.today) {
        return 301 https://vitaloop.today$request_uri;
    }

    if ($host = vitaloop.today) {
        return 301 https://vitaloop.today$request_uri;
    }

    server_name vitaloop.today www.vitaloop.today;
    listen 80;
    return 404;
}
