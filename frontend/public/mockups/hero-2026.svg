<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#efebe5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#efebe5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="url(#bg-gradient)"/>
  <ellipse cx="900" cy="320" rx="340" ry="180" fill="url(#glow)"/>
  <!-- Headline -->
  <text x="90" y="180" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="bold" fill="#fff" letter-spacing="-1.5" style="filter:url(#shadow)">Your Personal AI Health System</text>
  <text x="92" y="225" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e5e1db">From raw lab results to adaptive weekly protocols in under 60 seconds</text>
  <!-- Dashboard mockup group -->
  <g filter="url(#shadow)">
    <!-- Dashboard base -->
    <rect x="650" y="120" rx="32" width="440" height="340" fill="#23211c" stroke="#e5e1db" stroke-width="1.5"/>
    <text x="670" y="160" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e5e1db" font-weight="bold">Your VITALOOP dashboard</text>
    <text x="670" y="185" font-family="Inter, Arial, sans-serif" font-size="13" fill="#bcb8b2">What you see after your first upload</text>
    <!-- Top cards -->
    <rect x="670" y="200" rx="12" width="110" height="54" fill="#181715" stroke="#efebe5" stroke-width="0.7"/>
    <rect x="790" y="200" rx="12" width="90" height="54" fill="#181715" stroke="#efebe5" stroke-width="0.7"/>
    <rect x="890" y="200" rx="12" width="90" height="54" fill="#181715" stroke="#efebe5" stroke-width="0.7"/>
    <!-- Health Score -->
    <circle cx="725" cy="227" r="20" fill="#181715" stroke="#10b981" stroke-width="3"/>
    <text x="715" y="232" font-family="Inter, Arial, sans-serif" font-size="16" fill="#fff" font-weight="bold">82</text>
    <text x="747" y="232" font-family="Inter, Arial, sans-serif" font-size="11" fill="#bcb8b2">/100</text>
    <polygon points="735,217 740,222 735,227" fill="#10b981"/>
    <text x="680" y="250" font-family="Inter, Arial, sans-serif" font-size="12" fill="#e5e1db">Health Score</text>
    <!-- Open priorities -->
    <text x="805" y="225" font-family="Inter, Arial, sans-serif" font-size="18" fill="#fff" font-weight="bold">3</text>
    <text x="805" y="245" font-family="Inter, Arial, sans-serif" font-size="12" fill="#e5e1db">Open priorities</text>
    <!-- Last sync -->
    <text x="900" y="225" font-family="Inter, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold">2h ago</text>
    <text x="900" y="245" font-family="Inter, Arial, sans-serif" font-size="12" fill="#e5e1db">Last sync</text>
    <!-- Top Priority card -->
    <rect x="670" y="270" rx="16" width="220" height="90" fill="#191816" stroke="#10b981" stroke-width="1.2"/>
    <text x="690" y="295" font-family="Inter, Arial, sans-serif" font-size="14" fill="#10b981" font-weight="bold">TOP PRIORITY</text>
    <text x="690" y="315" font-family="Inter, Arial, sans-serif" font-size="16" fill="#fff" font-weight="bold">Ferritin recovery protocol</text>
    <rect x="690" y="330" width="160" height="10" rx="5" fill="#e5e1db"/>
    <rect x="690" y="330" width="110" height="10" rx="5" fill="#10b981"/>
    <text x="690" y="350" font-family="Inter, Arial, sans-serif" font-size="13" fill="#e5e1db">3 actions due this week</text>
    <!-- Weekly Adherence card -->
    <rect x="910" y="270" rx="16" width="160" height="90" fill="#191816" stroke="#10b981" stroke-width="1.2"/>
    <text x="930" y="295" font-family="Inter, Arial, sans-serif" font-size="14" fill="#10b981" font-weight="bold">WEEKLY ADHERENCE</text>
    <text x="930" y="315" font-family="Inter, Arial, sans-serif" font-size="16" fill="#fff" font-weight="bold">4 / 5</text>
    <rect x="930" y="330" width="120" height="10" rx="5" fill="#e5e1db"/>
    <rect x="930" y="330" width="120" height="10" rx="5" fill="#10b981"/>
    <text x="930" y="350" font-family="Inter, Arial, sans-serif" font-size="13" fill="#e5e1db">+9% vs last cycle</text>
    <!-- Floating elements -->
    <g opacity="0.18">
      <rect x="1080" y="140" width="40" height="54" rx="8" fill="#fff"/>
      <rect x="1120" y="200" width="32" height="32" rx="6" fill="#10b981"/>
      <circle cx="1150" cy="170" r="12" fill="#efebe5"/>
      <path d="M1100,180 Q1110,190 1120,200" stroke="#10b981" stroke-width="2" fill="none"/>
      <circle cx="1136" cy="216" r="4" fill="#10b981"/>
      <circle cx="1098" cy="160" r="3" fill="#bcb8b2"/>
    </g>
  </g>
</svg>
