<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vitaloop">
  <!-- White background -->
  <rect width="64" height="64" fill="white"/>
  
  <!-- Outer light teal circle -->
  <circle cx="32" cy="32" r="25" stroke="#5EEAD4" stroke-width="3.5" fill="none"/>
  
  <!-- Dark teal drop shape -->
  <path d="M 32 12 C 43 20 50 25 50 32 C 50 42 43 52 32 52 C 21 52 14 42 14 32 C 14 25 21 20 32 12 Z" fill="#2B8A8A"/>
  
  <!-- White arrow up inside drop -->
  <path d="M 32 20 L 32 35 M 25 30 L 32 23 L 39 30" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- White heartbeat line -->
  <path d="M 16 40 L 21 40 L 24 35 L 27 42 L 29 40 L 32 40 L 35 40 L 38 38 L 41 42 L 44 40 L 48 40" 
        stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
